<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Text/Glow Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="24" />

  <!-- Outer Glow Ring -->
  <rect x="36" y="36" width="440" height="440" rx="116" fill="none" stroke="#8b5cf6" stroke-width="12" opacity="0.3" filter="url(#glow)" />

  <!-- Monogram Initials "TI" -->
  <text x="50%" y="275" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="190" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-10" filter="url(#glow)">TI</text>
  
  <!-- Sub-label in Urdu "طلال" -->
  <text x="50%" y="415" font-family="'Noto Nastaliq Urdu', 'Gulzar', serif" font-size="95" font-weight="bold" fill="#06b6d4" text-anchor="middle" filter="url(#glow)">طلال</text>
</svg>